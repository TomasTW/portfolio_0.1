name: Hero black carrier v2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved CSS change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.dev.css')
          s = p.read_text()
          marker = 'body:has(.hero-canvas-sticky.is-dark)::after'
          if marker not in s:
              s = s.rstrip() + """

/* Safari hero black carrier: keep the final black state outside the fixed hero clipping/compositing boundary. */
body:has(.hero-canvas-sticky.is-dark)::after {
  content: '';
  position: fixed;
  inset: 0;
  background-color: var(--color-bg-surface-primary-default);
  pointer-events: none;
  z-index: 0;
  -webkit-transform: translate3d(0, 0, 0);
  transform: translate3d(0, 0, 0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
"""
              p.write_text(s + '\n')
          PY
          npx --yes clean-css-cli@5.3.3 -o style.css style.dev.css
      - name: Commit approved change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.dev.css style.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize hero black carrier [hero-black-carrier]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/_hero_black_carrier_v2.yml
          git commit -m 'chore: remove temporary hero carrier workflow'
          git push
