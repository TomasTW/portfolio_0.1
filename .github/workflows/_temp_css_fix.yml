name: Temporary CSS Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-css-fix:
    if: "!contains(github.event.head_commit.message, '[css-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply approved CSS change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.dev.css')
          s = p.read_text()
          old = '.hero-canvas-section {\n  height: 380vh;\n  min-height: 100svh;\n  overflow: hidden;'
          new = '.hero-canvas-section {\n  height: 380vh;\n  min-height: 100svh;\n  overflow: visible;'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one hero section rule, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Regenerate minified CSS
        run: npx --yes clean-css-cli@5.3.3 -o style.css style.dev.css

      - name: Commit CSS changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.dev.css style.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove hero section clipping [css-fix]'
          git push
