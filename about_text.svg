<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
  #what-i-do-text {
    animation: text-glitch-pulse 3.5s infinite ease-in-out, text-glitch-jitter 3.5s infinite ease-in-out;
    transform-origin: center center;
  }
  @keyframes text-glitch-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    14% { filter: drop-shadow(0 0 0 transparent); }
    15% { filter: drop-shadow(4px 0 0 rgba(0, 240, 255, 0.9)) drop-shadow(-4px 0 0 rgba(255, 0, 128, 0.9)) drop-shadow(0 0 10px rgba(255, 255, 102, 0.9)); }
    17% { filter: drop-shadow(-4px 0 0 rgba(0, 240, 255, 0.95)) drop-shadow(4px 0 0 rgba(255, 0, 128, 0.95)) drop-shadow(0 0 14px rgba(255, 255, 102, 1)); }
    19% { filter: drop-shadow(3px -1px 0 rgba(0, 240, 255, 0.85)) drop-shadow(-3px 1px 0 rgba(255, 0, 128, 0.85)); }
    21% { filter: drop-shadow(0 0 0 transparent); }
    54% { filter: drop-shadow(0 0 0 transparent); }
    55% { filter: drop-shadow(3.5px -2px 0 rgba(0, 240, 255, 0.9)) drop-shadow(-3.5px 2px 0 rgba(255, 0, 128, 0.9)) drop-shadow(0 0 8px rgba(255, 255, 102, 0.85)); }
    57% { filter: drop-shadow(-3px 2px 0 rgba(0, 240, 255, 0.95)) drop-shadow(3px -2px 0 rgba(255, 0, 128, 0.95)) drop-shadow(0 0 12px rgba(255, 255, 102, 1)); }
    59% { filter: drop-shadow(2px 0 0 rgba(0, 240, 255, 0.8)) drop-shadow(-2px 0 0 rgba(255, 0, 128, 0.8)); }
    61% { filter: drop-shadow(0 0 0 transparent); }
  }
  @keyframes text-glitch-jitter {
    0%, 100% { transform: translate(0, 0) skewX(0deg); }
    14% { transform: translate(0, 0) skewX(0deg); }
    15% { transform: translate(-5px, 2px) skewX(-5deg) scale(1.03); }
    17% { transform: translate(5px, -2px) skewX(5deg) scale(1.03); }
    19% { transform: translate(-2px, 1px) skewX(-2deg); }
    21% { transform: translate(0, 0) skewX(0deg); }
    54% { transform: translate(0, 0) skewX(0deg); }
    55% { transform: translate(4px, -3px) skewX(4deg) scale(1.03); }
    57% { transform: translate(-4px, 3px) skewX(-4deg) scale(1.03); }
    59% { transform: translate(2px, -1px) skewX(1deg); }
    61% { transform: translate(0, 0) skewX(0deg); }
  }
</style>
